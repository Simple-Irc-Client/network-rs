[package]
name = "sic-irc"
version = "2.0.3"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "IRC protocol client for Simple Irc Client"
repository = "https://github.com/Simple-Irc-Client/network-rs"

[lib]
name = "sic_irc"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
thiserror = "2"

# Trust anchors are platform-specific. Desktop reads the OS trust store via
# rustls-native-certs. Android has no file-based system trust store that crate
# can read (trust lives in the Java KeyStore), so we bundle Mozilla's WebPKI
# roots instead — sufficient for the publicly-trusted certs IRC networks use.
[target.'cfg(not(target_os = "android"))'.dependencies]
rustls-native-certs = "0.8"

[target.'cfg(target_os = "android")'.dependencies]
webpki-roots = "0.26"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
